name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0, v2.0, etc.
  release:
    types: [created]
  workflow_dispatch: # Allows manual triggering

env:
  main_project_module: app

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed if git commit count is used for fallback versionCode

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Extract Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$(echo "$PATCH" | tr -cd '0-9')
            CODE=$(( (${MAJOR:-0} * 10000) + (${MINOR:-0} * 100) + ${PATCH:-0} ))
          else
            VERSION=$(grep 'versionName' app/build.gradle | head -n 1 | awk '{print $3}' | tr -d '"')
            CODE=$(git rev-list --count HEAD)
          fi
          echo "VERSION_NAME=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$CODE" >> $GITHUB_OUTPUT
          echo "Extracted Version Name: $VERSION, Code: $CODE"

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PCI_VERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}" \
            -PCI_VERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}"
        env:
          KEYSTORE_FILE: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK file
        run: |
          VERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}"
          OLD_PATH="app/build/outputs/apk/release/app-release.apk"
          NEW_PATH="app/build/outputs/apk/release/ADB-auto-enable-${VERSION_NAME}.apk"
          if [ -f "$OLD_PATH" ]; then
            mv "$OLD_PATH" "$NEW_PATH"
            echo "Successfully renamed to ADB-auto-enable-${VERSION_NAME}.apk"
          else
            echo "Error: Release APK not found at $OLD_PATH"
            exit 1
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: adbautoenable-${{ steps.version.outputs.VERSION_NAME }}-release
          path: app/build/outputs/apk/release/ADB-auto-enable-*.apk

      - name: Create Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/ADB-auto-enable-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
