name: Build and Release APK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+*'
  workflow_dispatch: # build-only unless dispatched on a tag ref

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for git describe, tag listing and ancestry checks

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v([0-9]+)[.]([0-9]+)([.]([0-9]+))?$ ]]; then
              echo "::error::Tag '$REF_NAME' must look like vMAJOR.MINOR[.PATCH] (no suffixes)"
              exit 1
            fi
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[4]:-0}"
            if (( 10#$MINOR > 99 || 10#$PATCH > 99 )); then
              echo "::error::minor and patch must be <= 99 (versionCode = major*10000 + minor*100 + patch)"
              exit 1
            fi
            NAME="${REF_NAME#v}"
            HIGHEST="$(git tag --list 'v[0-9]*' | sed 's/^v//' | sort -V | tail -1)"
            TOP="$(printf '%s\n%s\n' "$HIGHEST" "$NAME" | sort -V | tail -1)"
            if [[ "$TOP" != "$NAME" ]]; then
              echo "::error::A higher tag ($HIGHEST) already exists; refusing to build $NAME"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tagged commit is not an ancestor of origin/main"
              exit 1
            fi
            echo "VERSION_NAME=$NAME" >> "$GITHUB_OUTPUT"
            echo "PUBLISH=true" >> "$GITHUB_OUTPUT"
          else
            NAME="$(git describe --tags --match 'v[0-9]*' 2>/dev/null || echo 0.0.0-dev)"
            echo "VERSION_NAME=${NAME#v}" >> "$GITHUB_OUTPUT"
            echo "PUBLISH=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: ./gradlew test

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: ./gradlew assembleRelease -PCI_VERSION_NAME="$VERSION_NAME"

      - name: Verify signature and version
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }} # lowercase hex, no colons; check skipped if unset
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=app/build/outputs/apk/release/app-release.apk
          FP="$("$BT/apksigner" verify --print-certs "$APK" | awk '/certificate SHA-256 digest/{print $NF; exit}')"
          echo "Signing certificate SHA-256: $FP"
          if [[ -n "${EXPECTED_CERT_SHA256:-}" && "$FP" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Signing certificate does not match EXPECTED_CERT_SHA256"
            exit 1
          fi
          BADGING="$("$BT/aapt2" dump badging "$APK" | grep '^package:')"
          echo "$BADGING"
          if [[ "$BADGING" != *"versionName='$VERSION_NAME'"* ]]; then
            echo "::error::APK versionName does not match $VERSION_NAME"
            exit 1
          fi

      - name: Rename APK file
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/ADB-auto-enable-${VERSION_NAME}.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: adbautoenable-${{ steps.version.outputs.VERSION_NAME }}-release
          path: app/build/outputs/apk/release/ADB-auto-enable-*.apk

      - name: Create Release and Upload APK
        if: steps.version.outputs.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/ADB-auto-enable-*.apk
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
